# ---- shortcuts ---------------------------------------------------------------------------------------------------
# The v12 counts of `mapgen 12345 24 shortcuts` (the cells around the first 12 arrivals of each level), recorded in
# tools/gate.hashes.json on 2026-10-25. The numbers are a measurement; the QUARTERING is the decision (progression decision
# 20: earlier-to-later shortcuts about a quarter as common, later-to-earlier ways unchanged; the tracker's before/after
# v11 -> v12: L2 steel doors open to L3 44 -> 15, L3 elevators to L4/L5 128 -> 26, L6 tripwires 203 -> 42, L7 cave mouths
# 57 -> 11). A count outside the tolerance means the layout changed: either the layout version moved (re-record the baseline
# with `gate.py --update-baselines` and this file) or something broke.
shortcuts:
  layout_version: 12
  basis: measurement
  counts:
