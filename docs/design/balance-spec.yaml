# The balance spec for Backrooms: Survival Story.
#
# STATUS: proposed, awaiting the user's approval. Nothing here is tuned: it records the intent where the user has decided
# and today's measurements where nobody has, so the gate can notice a number that moved without anyone meaning it.
#
# Read with: docs/design/progression/decisions.md (5, 8, 14, 20, 21), progression/revision.md, entity-ai-overhaul/decisions.md
# (10-34), entity-ai-overhaul/dialin.md 3.1, entity-difficulty.md 3d and 5, docs/design/testing/plan.md 2.4.
#
# Every number carries its basis:
#   basis: decision      the user's call, or plain arithmetic from it (the source is named after "M:" or in a note)
#   basis: measurement   what the build did on 2026-10-26 (branch testing, commit fd61c55; seed 12345, the Normal setting);
#                        nobody has said it is right, only that it is what the game does today. Approve it or change it.
# A number in a comment that starts "M:" is the measurement behind the row.
#
# Asserted by `python tools/gate.py --only scorecard` (stage `scorecard`) and graded against real play by
# `python tools/telemetry/report.py <sessions> --compare docs/design/balance-spec.yaml`.
#
# Units: bodies and sounds are per real hour, from `/backrooms ratecheck <id> <band> 20` on Normal (the director's rolls
# only). `felt` is bodies placed per real hour from `/backrooms feltrate here approach` with a dummy in the level (rolls x
# the share that finds a spot); it varies with the spot, hence the wide tolerance. `tol_pct` is the allowed distance from
# the target in percent, set from the sampling noise of a 20 hour check (3 sigma, never under 25). A row outside it is
# re-measured once over 100 hours before it fails.
# Armour: `hit` is the mean damage of one blow to a 15 health player after the set; `blows` the mean blows to kill.

status: "proposed, awaiting the user's approval"
spec_version: 1
measured_on: "2026-10-26"
measured_build: "branch testing, commit fd61c55, layout version 12, seed 12345"
setting: "normal"

# ---- global ----------------------------------------------------------------------------------------------------
global:
  # The entities setting (MenaceSystem.Difficulties). Spawns divides both mean intervals; damage multiplies every hit.
  # Lethality is NOT a setting (progression decision 8): the names shifted up one step; this is the shifted table.
  settings:                # basis: decision (progression 8; entity-difficulty 3d)
    "off":    {spawns: 1,    damage: 0,    mix_danger: 0,   cap_bonus_outer: 0, cap_bonus_heart: 0}
    "verylow": {spawns: 2,    damage: 0.5,  mix_danger: 0,   cap_bonus_outer: 0, cap_bonus_heart: 0}
    "low":     {spawns: 3.5,  damage: 0.75, mix_danger: 0,   cap_bonus_outer: 0, cap_bonus_heart: 0}
    "normal":  {spawns: 5.5,  damage: 1,    mix_danger: 0,   cap_bonus_outer: 0, cap_bonus_heart: 0}
    "high":    {spawns: 8.5,  damage: 1.3,  mix_danger: 0.3, cap_bonus_outer: 1, cap_bonus_heart: 0}
    "veryhigh": {spawns: 13,   damage: 1.6,  mix_danger: 0.6, cap_bonus_outer: 1, cap_bonus_heart: 1}
  # Set-pieces (night visits to a sleeping player, hive waves, the Mangled's fog, the Beast) scale with the square root of the
  # setting's spawns multiplier, not the multiplier itself (progression decision 14). On Normal: sqrt(5.5) = 2.35.
  set_piece_scale: "sqrt(spawns)"      # basis: decision
  set_piece_scale_normal: 2.35
  # The director's set-pieces: the Flickering is Level 1's only, the Screaming Level 2's only (entity decisions 22, 23).
  flickering_levels: ["1"]             # basis: decision
  screaming_levels: ["2"]              # basis: decision
  flickering_cooldown_ingame_hours: 20 # basis: decision (22)
  # Hunters outrun a sprint from Level 3 (danger .36), except the lore-slow (progression decision 5)
  hunters_outrun_sprint_from_level: "3"      # basis: decision
  outrun_exceptions: [wretch, clump, duller]
  # Lethality anchors (progression decisions 5 and 22), checked on the Smiler, the median hunter, against 15 health.
  lethality_anchors:       # basis: decision
    - {entity: smiler, level: "3", set: none, blows_ceil: [2, 3], why: "2 to 3 blows unarmoured at Level 3"}
    - {entity: smiler, level: "8", set: none, blows_ceil: [1, 2], why: "1 to 2 blows unarmoured by Level 8"}
    - {entity: smiler, level: "3", set: sewn-leather, hit_ratio_max: 0.6, why: "leather halves the Level 3 blow"}
    - {entity: smiler, level: "8", set: lamellar-tinbronze, fewest_min: 3, why: "bronze to stand two blows at Level 8, even on the worst piece"}
    - {entity: smiler, level: "9", set: plate-iron, fewest_min: 3, why: "iron plate at Level 9 and deeper"}
  # Scarcity of Almond Water and food by lore class (progression decision 21). Exempt: Level 94, the Hub, Level 974.
  class_scale: {"0": 1, "1": 1, "2": 1, "3": 0.7, "4": 0.5, "5": 0.35}   # basis: decision
  class_scale_exempt: ["94", "hub", "974"]
  # Shortcut counts: percent tolerance, with at least this much absolute slack
  shortcut_tol_pct: 15
  shortcut_abs_tol: 2
  # One kind of menacing thing at a time in Classes 0-2, two in 3-5 (entity decision 29)
  max_kinds_rule: "1 in classes 0-2, 2 in classes 3-5"                    # basis: decision

