description: Level 1's nearest boundary gate, its M.E.G. placard seen from the approach, and the class crossing line on going through.
steps:
  - bot: closeguis
  - bot: hud off
  - server: /time set 12:00
  - nearest_gate: 2
  - face: megplacard
  - bot: wait 700
  - shot: placard-near
  - expect_shot: placard-near
  - note: "Crossing by walking is not scripted (the camera faces the plate, not the opening): goto 2 stands in for it, untested whether a goto counts as a crossing for the chat line."
  - cmd: /backrooms goto 2
  - bot: wait 3000
  - bot: ready 48
  - bot: look 0 0
  - shot: past-gate
  - note: "The crossing line is said only when the far side is a higher class (Class 3+) and once per level per session."
  - expect_chat: in here
