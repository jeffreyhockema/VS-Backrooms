  - bot: movewait
  - bot: ready 48
  - bot: wait 1500
  - bot: cheats 0 feature
  - shot: x-cheats-l73-features
  - bot: cheats close
  - cmd: /backrooms features
  - expect_chat: l73northdoor
  - cmd: /backrooms feature l73path timeout=30
  - expect_chat: Stone path up the hill
