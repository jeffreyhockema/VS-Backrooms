  - bot: closeguis
  - bot: hud on
  - bot: wait 3000
  - bot: ready 48
  - cmd: /backrooms heal
  - cmd: /backrooms director off
  - cmd: /gamemode creative
  - cmd: /backrooms discover reset
  # ----- Level 73: the feature list, then Coran on the path below the gate
