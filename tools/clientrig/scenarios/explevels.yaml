description: The experimental levels on main 0.610.5's systems (run with --seed 12345, whose showcase spots the Coran step uses) - the F7 Travel tab's Go to feature list in Level 73 and in Level 14; every new creature met by sight (Coran, the Hunter and an Infecting Agent, a Misglitch, the Coach, the Travel Planner, a snake, a keeper of the Order, the Great Old Adder), the sentries by their scream, and a Black Shuck in Level 47; then What Lives Here, the Shuck's page, The Levels and Level 47's page.
