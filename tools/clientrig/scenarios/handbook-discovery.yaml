description: The handbook learns as you do - a new player has visited only Level 0 and met nothing; a goto marks Level 1; a Hound in creative (it does not attack) is not met while you look at the ceiling, even four blocks from it, and is met once looked at for a second; What Lives Here, the Hound's page, The Levels, a level page and Ways Between Levels show only that, and hidden pages stay out of the list and search (read by eye from the screenshots, and from the hbfilter lines).
steps:
  - bot: closeguis
  - bot: wait 3000
  - cmd: /backrooms discover status
  - expect_chat: "visited 1 (0); met 0 of"
  - bot: handbook backrooms-entities
  - bot: hbscroll 1
  - shot: disc-new-entities
  - bot: handbook backrooms-thresholds
  - bot: hbscroll 1
  - shot: disc-new-ways
  - bot: hbfilter -
  - expect_log: "hbfilter '': 9 backrooms pages: backrooms-home backrooms-finding backrooms-salvage backrooms-food backrooms-rest backrooms-levels backrooms-level-0 backrooms-thresholds backrooms-entities"
  - bot: closeguis
  - cmd: /backrooms goto 1
  - bot: movewait
  - bot: ready 48
  - cmd: /backrooms discover status
  - expect_chat: "visited 2 (0, 1); met 0 of"
